<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <linearGradient id="body_axon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="roof_axon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Road -->
  <rect x="0" y="92" width="160" height="18" fill="#0f172a" rx="2"/>
  <rect x="20" y="98" width="25" height="3" fill="#374151" rx="1"/>
  <rect x="65" y="98" width="25" height="3" fill="#374151" rx="1"/>
  <rect x="110" y="98" width="25" height="3" fill="#374151" rx="1"/>
  <!-- Bus body -->
  <rect x="8" y="28" width="144" height="64" fill="url(#body_axon)" rx="8"/>
  <!-- Roof -->
  <rect x="12" y="20" width="136" height="12" fill="url(#roof_axon)" rx="4"/>
  <!-- Windows row -->
  <rect x="18" y="35" width="22" height="16" fill="#1e293b" rx="3" opacity="0.85"/>
  <rect x="46" y="35" width="22" height="16" fill="#1e293b" rx="3" opacity="0.85"/>
  <rect x="74" y="35" width="22" height="16" fill="#1e293b" rx="3" opacity="0.85"/>
  <rect x="102" y="35" width="22" height="16" fill="#1e293b" rx="3" opacity="0.85"/>
  <!-- Windscreen -->
  <rect x="126" y="32" width="22" height="22" fill="#1e3a8a" rx="3" opacity="0.7"/>
  <!-- Headlights -->
  <circle cx="147" cy="68" r="4" fill="#facc15" opacity="0.9"/>
  <circle cx="147" cy="80" r="3" fill="#f97316" opacity="0.7"/>
  <!-- Wheels -->
  <circle cx="38" cy="92" r="10" fill="#111827"/>
  <circle cx="38" cy="92" r="5" fill="#374151"/>
  <circle cx="122" cy="92" r="10" fill="#111827"/>
  <circle cx="122" cy="92" r="5" fill="#374151"/>
  <!-- Axon logo text -->
  <text x="52" y="62" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="white" letter-spacing="1">AXON</text>
  <!-- Stripe -->
  <rect x="8" y="72" width="144" height="3" fill="rgba(255,255,255,0.15)" rx="1"/>
</svg>
